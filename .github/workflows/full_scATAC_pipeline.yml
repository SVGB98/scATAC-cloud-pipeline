name: Full scATAC Pipeline (SRR28074482, minimap2)

on:
  workflow_dispatch:

jobs:

  download-fastq:
    runs-on: ubuntu-latest

    steps:
    - name: Download FASTQ files from ENA
      run: |
        wget -O SRR28074482_1.fastq.gz \
          "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR280/082/SRR28074482/SRR28074482_1.fastq.gz"

        wget -O SRR28074482_2.fastq.gz \
          "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR280/082/SRR28074482/SRR28074482_2.fastq.gz"

    - name: Upload FASTQ artifact
      uses: actions/upload-artifact@v4
      with:
        name: SRR28074482-fastq
        path: |
          SRR28074482_1.fastq.gz
          SRR28074482_2.fastq.gz

   align:
    runs-on: ubuntu-latest
    needs: download-fastq

    steps:
    - name: Download FASTQ artifact
      uses: actions/download-artifact@v4
      with:
        name: SRR28074482-fastq
        path: .

    - name: Install minimap2 and samtools
      run: |
        sudo apt-get update
        sudo apt-get install -y minimap2 samtools

    - name: Download hg38 reference genome
      run: |
        wget -O hg38.fa.gz "https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz"
        gunzip hg38.fa.gz

    - name: Align with minimap2 and sort/index BAM
      run: |
        minimap2 -t 16 --secondary=no -a hg38.fa \
          SRR28074482_1.fastq.gz SRR28074482_2.fastq.gz \
          | samtools sort -@ 8 -o aligned.bam
        samtools index aligned.bam

    - name: Upload alignment artifact
      uses: actions/upload-artifact@v4
      with:
        name: SRR28074482-alignment-minimap2
        path: .

  macs2:
    runs-on: ubuntu-latest
    needs: align

    steps:
    - name: Download alignment artifact
      uses: actions/download-artifact@v4
      with:
        name: SRR28074482-alignment-minimap2
        path: .

    - name: Install MACS2
      run: |
        python -m pip install --upgrade pip
        pip install macs2

    - name: Call peaks with MACS2 (narrow peaks)
      run: |
        macs2 callpeak \
          -t aligned.bam \
          -f BAM \
          -g hs \
          -n SRR28074482 \
          --outdir macs2_peaks \
          --keep-dup all \
          -q 0.01

    - name: Upload MACS2 artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SRR28074482-macs2
        path: macs2_peaks

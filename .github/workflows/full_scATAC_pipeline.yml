name: Full scATAC Pipeline (SRR28074482, minimap2)

on:
  workflow_dispatch:

jobs:

  download-fastq:
    runs-on: ubuntu-latest

    steps:
    - name: Download FASTQ files from ENA
      run: |
        wget -O SRR28074482_1.fastq.gz \
          "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR280/082/SRR28074482/SRR28074482_1.fastq.gz"

        wget -O SRR28074482_2.fastq.gz \
          "https://ftp.sra.ebi.ac.uk/vol1/fastq/SRR280/082/SRR28074482/SRR28074482_2.fastq.gz"

    - name: Upload FASTQ artifact
      uses: actions/upload-artifact@v4
      with:
        name: SRR28074482-fastq
        path: |
          SRR28074482_1.fastq.gz
          SRR28074482_2.fastq.gz

  align:
    runs-on: ubuntu-latest
    needs: download-fastq

    steps:
    - name: Download FASTQ artifact
      uses: actions/download-artifact@v4
      with:
        name: SRR28074482-fastq
        path: .

    - name: Install tools (minimap2, samtools, pigz)
      run: |
        sudo apt-get update
        sudo apt-get install -y samtools pigz
        wget https://github.com/lh3/minimap2/releases/download/v2.28/minimap2-2.28_x64-linux.tar.bz2
        tar -xjf minimap2-2.28_x64-linux.tar.bz2
        sudo mv minimap2-2.28_x64-linux/minimap2 /usr/local/bin/

    - name: Download hg38 reference (FASTA only)
      run: |
        mkdir ref
        cd ref
        wget https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz
        gunzip hg38.fa.gz

    - name: Align with minimap2 (paired-end)
      run: |
        minimap2 -t 8 -ax sr ref/hg38.fa \
          SRR28074482_1.fastq.gz SRR28074482_2.fastq.gz \
          | samtools view -bS - > aligned.bam

    - name: Sort + index BAM
      run: |
        samtools sort -o aligned.sorted.bam aligned.bam
        samtools index aligned.sorted.bam
        rm aligned.bam

    - name: Mark duplicates
      run: |
        samtools markdup aligned.sorted.bam aligned.markdup.bam
        samtools index aligned.markdup.bam
        rm aligned.sorted.bam aligned.sorted.bam.bai

    - name: Generate fragments.tsv.gz
      run: |
        samtools view -h aligned.markdup.bam \
          | awk 'BEGIN{OFS="\t"} !/^@/ {split($0,a,"\t"); chr=a[3]; start=a[4]-1; end=start+length(a[10]); print chr,start,end,a[1]}' \
          | pigz > fragments.tsv.gz

    - name: Upload alignment artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SRR28074482-alignment-minimap2
        path: |
          aligned.markdup.bam
          aligned.markdup.bam.bai
          fragments.tsv.gz
